{% extends "base.html" %}
{% block title %}회원가입 · Customer Manager{% endblock %}
{% block content %}
<section class="panel auth-panel">
  <h1>회원가입</h1>
  <p class="muted">Customer Manager 계정을 만드세요.</p>
  {% if error %}<div class="message error">{{ error }}</div>{% endif %}
  <form action="/signup" method="post">
    <label for="name">이름</label>
    <input id="name" name="name" value="{{ name }}" maxlength="100" autocomplete="name" required>
    <label for="email">이메일</label>
    <input id="email" name="email" type="email" value="{{ email }}" maxlength="255" autocomplete="email" required>
    <label for="password">비밀번호</label>
    <input id="password" name="password" type="password" minlength="8" maxlength="72" autocomplete="new-password" required>
    <button class="submit" type="submit">계정 만들기</button>
  </form>
  <p class="auth-link">이미 계정이 있으신가요? <a href="/login">로그인</a></p>
</section>
{% endblock %}
