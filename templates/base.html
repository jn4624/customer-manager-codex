<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Customer Manager{% endblock %}</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #182230; background: #f5f7fb; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; }
    header { height: 68px; display: flex; justify-content: space-between; align-items: center; padding: 0 5vw; background: #fff; border-bottom: 1px solid #e4e8ef; }
    .primary-nav { display: flex; align-items: center; gap: 8px; height: 100%; }
    .primary-nav a { display: inline-flex; align-items: center; height: 100%; padding: 0 12px; border-bottom: 3px solid transparent; color: #475467; text-decoration: none; font-size: 14px; font-weight: 650; }
    .primary-nav a:hover { color: #2446a8; }
    .primary-nav a.active { border-bottom-color: #315bea; color: #2446a8; }
    .account { display: flex; align-items: center; gap: 16px; font-size: 14px; }
    .account form { margin: 0; }
    main { width: min(1040px, 92vw); margin: 48px auto; }
    .panel { background: #fff; border: 1px solid #e4e8ef; border-radius: 14px; padding: 28px; box-shadow: 0 8px 24px #24324a0a; }
    .auth-panel { width: min(440px, 100%); margin: 6vh auto; }
    h1 { margin: 0 0 8px; font-size: 26px; }
    .muted { color: #667085; }
    label { display: block; margin: 18px 0 6px; font-size: 14px; font-weight: 600; }
    input { width: 100%; border: 1px solid #cfd6e1; border-radius: 8px; padding: 11px 12px; font: inherit; }
    button, .button { border: 0; border-radius: 8px; background: #315bea; color: white; padding: 11px 16px; font: inherit; font-weight: 650; cursor: pointer; text-decoration: none; }
    button.secondary { color: #344054; border: 1px solid #d0d5dd; background: #fff; padding: 8px 12px; }
    .submit { width: 100%; margin-top: 22px; }
    .message { margin: 16px 0; padding: 12px 14px; border-radius: 8px; background: #eef4ff; color: #2446a8; }
    .error { background: #fff0f0; color: #a12727; }
    .auth-link { margin-top: 20px; text-align: center; color: #667085; font-size: 14px; }
    .auth-link a { color: #315bea; }
    .table-wrap { overflow-x: auto; margin-top: 24px; }
    .customer-search { display: flex; align-items: flex-end; flex-wrap: wrap; gap: 12px; margin-top: 24px; }
    .search-field { display: grid; gap: 6px; min-width: 160px; }
    .search-field:first-child { flex: 1 1 280px; }
    .search-field label { margin: 0; font-size: 13px; }
    .search-field input, .search-field select { width: 100%; min-height: 42px; border: 1px solid #cfd6e1; border-radius: 8px; padding: 9px 12px; background: #fff; color: inherit; font: inherit; }
    .button.secondary { color: #344054; border: 1px solid #d0d5dd; background: #fff; padding: 10px 14px; font-weight: 600; }
    .visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    .section-heading { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
    .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 20px; }
    .form-actions { display: flex; gap: 12px; align-items: center; margin-top: 22px; }
    .danger { color: #a12727; border: 1px solid #f0b7b7; background: #fff; }
    .detail-actions { display: flex; justify-content: flex-end; align-items: center; gap: 10px; }
    .customer-detail-actions { margin: 18px 0 28px; }
    .customer-detail-actions button { width: 116px; height: 42px; padding: 0 14px; }
    .customer-list-actions { display: flex; align-items: center; gap: 10px; }
    .customer-list-actions form { margin: 0; }
    dialog { width: min(680px, 92vw); border: 1px solid #e4e8ef; border-radius: 14px; padding: 28px; color: #182230; box-shadow: 0 24px 80px #18223033; }
    dialog::backdrop { background: #18223066; }
    .customer-create-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 24px; }
    .selection-cell { width: 42px; text-align: center; }
    .table-wrap input[type="checkbox"] { width: auto; margin: 0; vertical-align: middle; }
    .customer-total strong { color: #315bea; font-size: 1.08em; }
    .pagination { display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 5px; margin: 24px 0 4px; }
    .page-number, .page-step { display: inline-flex; justify-content: center; align-items: center; min-width: 34px; height: 34px; padding: 0 8px; border: 1px solid #e1e7f0; border-radius: 9px; background: #fff; color: #475467; font-size: 14px; font-weight: 650; text-decoration: none; transition: background .15s ease, border-color .15s ease, color .15s ease, transform .15s ease; }
    .page-number:hover, .page-step:hover { border-color: #b5c5fc; background: #f4f7ff; color: #2446a8; transform: translateY(-1px); }
    .page-number.active { border-color: #315bea; background: #315bea; color: #fff; box-shadow: 0 4px 12px #315bea33; }
    .pagination-summary { flex-basis: 100%; margin-top: 3px; color: #667085; font-size: 12px; text-align: center; }
    .clickable-row { cursor: pointer; }
    .clickable-row:hover, .clickable-row:focus { background: #f5f8ff; outline: 2px solid #a9bdfc; outline-offset: -2px; }
    button:disabled { cursor: not-allowed; opacity: .6; }
    table { width: 100%; border-collapse: collapse; white-space: nowrap; }
    th, td { text-align: left; padding: 12px; border-bottom: 1px solid #edf0f4; font-size: 14px; }
    th { color: #667085; font-weight: 600; background: #fafbfc; }
    @media (max-width: 600px) { header { padding: 0 4vw; } main { margin: 28px auto; } .panel { padding: 22px; } .account { gap: 8px; } .section-heading { align-items: flex-start; } .form-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <nav class="primary-nav" aria-label="주요 내비게이션">
      <a href="/"{% if request.url.path == "/" %} class="active" aria-current="page"{% endif %}>홈</a>
      <a href="/customers"{% if request.url.path == "/customers" or request.url.path.startswith("/customers/") %} class="active" aria-current="page"{% endif %}>고객 목록</a>
    </nav>
    <div class="account">
      {% if user %}
        <span>{{ user.name }}님 안녕하세요</span>
        <form action="/logout" method="post"><button class="secondary" type="submit">로그아웃</button></form>
      {% endif %}
    </div>
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
